name: Deploy VPS (site + app)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Que déployer"
        required: true
        default: both
        type: choice
        options:
          - both
          - site-only
          - app-only
      ref:
        description: "Branche ou tag à déployer (app: git pull sur le VPS)"
        required: false
        default: main

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require VPS secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "Missing secret VPS_SSH_KEY"; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        if: inputs.target != 'app-only'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            website-docs/package-lock.json
            website-docs/homepage/package-lock.json

      - name: Install site dependencies
        if: inputs.target != 'app-only'
        working-directory: website-docs
        run: npm run setup

      - name: Build static site
        if: inputs.target != 'app-only'
        working-directory: website-docs
        run: npm run build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER || 'root' }}" >> ~/.ssh/config

      - name: Deploy static site
        if: inputs.target != 'app-only'
        env:
          VPS_SITE_DIR: ${{ secrets.VPS_SITE_DIR || '/srv/www/weknora/current' }}
          RELEASE: /srv/www/weknora/releases/${{ github.run_id }}
        run: |
          ssh vps "mkdir -p '$RELEASE' '$VPS_SITE_DIR'"
          rsync -az --delete -e ssh website-docs/static-site/ "vps:${RELEASE}/"
          ssh vps "ln -sfn '$RELEASE' '$VPS_SITE_DIR' && (nginx -t && nginx -s reload || systemctl reload nginx || true)"

      - name: Deploy WeKnora (Docker Compose)
        if: inputs.target != 'app-only'
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/WeKnora' }}
        run: |
          ssh vps "set -e
            cd '$VPS_APP_DIR'
            git fetch --all --prune
            git checkout '${{ inputs.ref }}' 2>/dev/null || git pull --ff-only
            docker compose pull
            docker compose up -d --build --remove-orphans
            docker compose ps
          "
