# Traefik edge routing for gsms-template (VPS with an external Traefik stack).
#
# Assumes Traefik runs elsewhere on the same Docker host and exposes an external
# network (default name: traefik). Attach this stack with:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.traefik.yml up -d
#
# Set in .env (production examples):
#   TRAEFIK_NETWORK=traefik
#   LANDING_HOST=global-it-ss.com          # apex host served by `site`
#   LANDING_WWW_HOST=www.global-it-ss.com
#   APP_HOST_FQDN=app.global-it-ss.com
#   TRAEFIK_ENTRYPOINT=websecure
#   TRAEFIK_CERT_RESOLVER=letsencrypt
#   TRAEFIK_ROUTER_MIDDLEWARES=gsms-secure   # optional; Hostinger GSMS VPS (see deploy/docker-compose.traefik.gsms.yml)
#
# DNS A/AAAA: global-it-ss.com, www.global-it-ss.com, app.global-it-ss.com → VPS.
#
# When Traefik terminates TLS, you can avoid binding site/frontend on public host
# ports (Compose 2.24+): the `!reset []` entries below clear published ports.

# Public vitrine: service `site` (Nginx, homepage + /docs/), not the removed landing/ Next app.

services:
  site:
    networks:
      - traefik
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.gsms-site.rule=Host(`${LANDING_WWW_HOST:-www.global-it-ss.com}`) || Host(`${LANDING_HOST:-global-it-ss.com}`)
      - traefik.http.routers.gsms-site.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gsms-site.tls=true
      - traefik.http.routers.gsms-site.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      # Comma-separated chain (e.g. gsms-secure,gsms-site-www@docker). Only one middlewares label — do not add another below.
      - traefik.http.routers.gsms-site.middlewares=${TRAEFIK_ROUTER_MIDDLEWARES:-}
      - traefik.http.services.gsms-site.loadbalancer.server.port=80
      # Optional apex → www: uncomment the three middleware definition lines only, then extend TRAEFIK_ROUTER_MIDDLEWARES
      # (e.g. gsms-secure,gsms-site-www@docker). Do not uncomment a second routers.gsms-site.middlewares label.
      # - traefik.http.middlewares.gsms-site-www.redirectregex.regex=^https://${LANDING_HOST:-global-it-ss.com}/(.*)
      # - traefik.http.middlewares.gsms-site-www.redirectregex.replacement=https://${LANDING_WWW_HOST:-www.global-it-ss.com}/$${1}
      # - traefik.http.middlewares.gsms-site-www.redirectregex.permanent=true

  # App UI uses gsms-weknora-ui from the root compose file (local build); never pull wechatopenai/weknora-ui.
  frontend:
    networks:
      - traefik
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.gsms-app.rule=Host(`${APP_HOST_FQDN:-app.global-it-ss.com}`)
      - traefik.http.routers.gsms-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gsms-app.tls=true
      - traefik.http.routers.gsms-app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.gsms-app.middlewares=${TRAEFIK_ROUTER_MIDDLEWARES:-}
      - traefik.http.services.gsms-app.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
