# Traefik edge routing for gsms-template (VPS with an external Traefik stack).
#
# Post-merge check (PR #7 on main): `docker compose -f docker-compose.yml
# -f deploy/docker-compose.traefik.yml config` must succeed; landing `npm ci` +
# lint/typecheck/test/build matches `.github/workflows/landing.yml`.
#
# Assumes Traefik runs elsewhere on the same Docker host and exposes an external
# network (default name: traefik). Attach this stack with:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.traefik.yml up -d
#
# Set in .env (production examples):
#   TRAEFIK_NETWORK=traefik
#   LANDING_HOST=global-it-ss.com
#   LANDING_WWW_HOST=www.global-it-ss.com
#   APP_HOST_FQDN=app.global-it-ss.com
#   TRAEFIK_ENTRYPOINT=websecure
#   TRAEFIK_CERT_RESOLVER=letsencrypt
#
# DNS A/AAAA: global-it-ss.com, www.global-it-ss.com, app.global-it-ss.com → VPS.
# Optional CMS API (landing NEXT_PUBLIC_API_URL): api.global-it-ss.com → your Core host.
#
# When Traefik terminates TLS, you can avoid binding landing/frontend on public host
# ports (Compose 2.24+): the `!reset []` entries below clear published ports.

services:
  landing:
    networks:
      - traefik
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.gsms-landing.rule=Host(`${LANDING_WWW_HOST:-www.global-it-ss.com}`) || Host(`${LANDING_HOST:-global-it-ss.com}`)
      - traefik.http.routers.gsms-landing.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gsms-landing.tls=true
      - traefik.http.routers.gsms-landing.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.gsms-landing.loadbalancer.server.port=3000
      # Optional: redirect apex → www (uncomment and set LANDING_HOST / LANDING_WWW_HOST)
      # - traefik.http.middlewares.gsms-landing-www.redirectregex.regex=^https://${LANDING_HOST:-global-it-ss.com}/(.*)
      # - traefik.http.middlewares.gsms-landing-www.redirectregex.replacement=https://${LANDING_WWW_HOST:-www.global-it-ss.com}/$${1}
      # - traefik.http.middlewares.gsms-landing-www.redirectregex.permanent=true
      # - traefik.http.routers.gsms-landing.middlewares=gsms-landing-www@docker

  frontend:
    networks:
      - traefik
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.gsms-app.rule=Host(`${APP_HOST_FQDN:-app.global-it-ss.com}`)
      - traefik.http.routers.gsms-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gsms-app.tls=true
      - traefik.http.routers.gsms-app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.gsms-app.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
