# Hostinger GSMS VPS — Traefik companion (merge after deploy/docker-compose.traefik.yml).
#
# Same edge pattern as gsms-logistics-landing: external network `gsms`, entrypoint
# websecure, certresolver letsencrypt, middleware gsms-secure on routers.
#
# global-it-ss: also clears fixed `container_name` from docker-compose.yml so
# COMPOSE_PROJECT_NAME=globalitss yields project-prefixed names (e.g. globalitss-frontend-1),
# and unpublishes `app` on the host (API via Traefik + internal `app:8080` only).
# `app` and `docreader` get local image names and `pull_policy: build`, so the server
# runs this repo's code (French server messages, no ebooklib) instead of the
# upstream wechatopenai/weknora-* images from Docker Hub.
# Requires Docker Compose 2.24+ for `!reset`.
#
# In .env on the VPS:
#   COMPOSE_PROJECT_NAME=globalitss
#   TRAEFIK_NETWORK=gsms
#   TRAEFIK_ROUTER_MIDDLEWARES=gsms-secure
#
#   docker compose -f docker-compose.yml \
#     -f deploy/docker-compose.traefik.yml \
#     -f deploy/docker-compose.traefik.gsms.yml up -d

services:
  site:
    container_name: !reset null
    ports: !reset []
    labels:
      - traefik.http.routers.gsms-site.middlewares=gsms-secure
      - traefik.http.routers.gsms-site.service=gsms-site
      - traefik.http.services.gsms-site.loadbalancer.server.port=80

  frontend:
    container_name: !reset null
    ports: !reset []
    labels:
      - traefik.http.routers.gsms-app.middlewares=gsms-secure
      - traefik.http.routers.gsms-app.service=gsms-app
      - traefik.http.services.gsms-app.loadbalancer.server.port=80

  app:
    image: gsms-weknora-app:${WEKNORA_VERSION:-latest}
    pull_policy: build
    container_name: !reset null
    ports: !reset []

  postgres:
    container_name: !reset null

  redis:
    container_name: !reset null

  docreader:
    image: gsms-weknora-docreader:${WEKNORA_VERSION:-latest}
    pull_policy: build
    container_name: !reset null

  sandbox:
    container_name: !reset null

  odl-hybrid:
    container_name: !reset null
